name: Gemini AI Auto-Coder

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  gemini-coder:
    if: contains(github.event.issue.labels.*.name, 'ai-feature')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Gen AI SDK
        run: npm install @google/genai

      - name: Generate Code via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node -e '
          const fs = require("fs");
          const { GoogleGenAI } = require("@google/genai");

          async function run() {
            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
            
            // Read existing index.html if present
            let existingCode = "";
            if (fs.existsSync("index.html")) {
              existingCode = fs.readFileSync("index.html", "utf8");
            }

            const prompt = `You are an expert web developer for an Edtech platform.
            
            Existing HTML Code:
            ${existingCode}

            Task:
            Title: ${process.env.ISSUE_TITLE}
            Instructions: ${process.env.ISSUE_BODY}

            Update the index.html file to incorporate these design changes, making the website look modern, professional, and ready for business advertising.
            IMPORTANT: Return ONLY raw HTML code. Do NOT wrap the code in \`\`\`html markdown blocks or include any extra commentary.`;

            const response = await ai.models.generateContent({
              model: "gemini-2.5-flash",
              contents: prompt,
            });

            let updatedCode = response.text.trim();
            updatedCode = updatedCode.replace(/^```html\s*/i, "").replace(/```$/i, "").trim();

            fs.writeFileSync("index.html", updatedCode);
            console.log("Successfully updated index.html");
          }

          run().catch(err => {
            console.error(err);
            process.exit(1);
          });
          '

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: AI update index.html for issue #${{ github.event.issue.number }}"
          title: "AI Feature: ${{ github.event.issue.title }}"
          body: "Automated Pull Request generated by Gemini Pro for Issue #${{ github.event.issue.number }}."
          branch: "ai-feature-${{ github.event.issue.number }}"
          delete-branch: true
