name: Gemini AI Auto-Coder

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  gemini-coder:
    if: contains(github.event.issue.labels.*.name, 'ai-feature')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install @google/genai

      - name: Generate Code via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node generate.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: AI updates for issue #${{ github.event.issue.number }}"
          title: "AI Feature: ${{ github.event.issue.title }}"
          body: "Automated Pull Request generated by Gemini Pro for Issue #${{ github.event.issue.number }}."
          branch: "ai-feature-${{ github.event.issue.number }}"
          delete-branch: true
