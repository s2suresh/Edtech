name: Gemini AI Auto-Coder

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  gemini-coder:
    if: contains(github.event.issue.labels.*.name, 'ai-feature')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Gen AI SDK
        run: npm install @google/genai

      - name: Generate Code via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node -e '
          const fs = require("fs");
          const { GoogleGenAI } = require("@google/genai");

          async function run() {
            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
            const prompt = `You are a frontend developer. Update the index.html file for an Edtech platform based on this issue request:
            Title: ${process.env.ISSUE_TITLE}
            Details: ${process.env.ISSUE_BODY}
            
            Return ONLY valid raw HTML code without markdown codeblocks or extra text.`;

            const response = await ai.models.generateContent({
              model: "gemini-2.5-flash",
              contents: prompt,
            });

            const updatedCode = response.text.replace(/```html|```/g, "").trim();
            fs.writeFileSync("index.html", updatedCode);
            console.log("Successfully updated index.html");
          }

          run().catch(err => { console.error(err); process.exit(1); });
          '

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: AI updates for issue #${{ github.event.issue.number }}"
          title: "AI Feature: ${{ github.event.issue.title }}"
          body: "Generated by Gemini Pro for issue #${{ github.event.issue.number }}."
          branch: "ai-feature-${{ github.event.issue.number }}"
          delete-branch: true
