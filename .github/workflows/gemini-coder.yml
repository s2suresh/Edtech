name: Gemini AI Auto-Coder

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  gemini-coder:
    # Only runs when an issue is tagged with the "ai-feature" label
    if: contains(github.event.issue.labels.*.name, 'ai-feature')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Gemini Code Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Creates or updates landing page files based on your issue description
          npx google-gemini-cli --prompt "Issue Title: $ISSUE_TITLE \n Instructions: $ISSUE_BODY"

      - name: Open Pull Request automatically
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: AI generated landing page updates for issue #${{ github.event.issue.number }}"
          title: "AI Feature: ${{ github.event.issue.title }}"
          body: "This PR was generated by Gemini Pro based on issue #${{ github.event.issue.number }}."
          branch: "ai-feature-${{ github.event.issue.number }}"
          delete-branch: true
